[project]
name = "nekolang"
version = "0.1.0"
description = "A Scheme-like teaching language with S-expressions and LLVM backend"
requires-python = ">=3.10"
dependencies = [
    "llvmlite>=0.40",
]
license = {text = "MIT"}
authors = [
    {name = "Xiami Yu"},
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neko"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pytest>=8",
]