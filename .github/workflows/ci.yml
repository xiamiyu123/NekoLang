name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  linux-x86-llvm-fast:
    name: Linux x86_64 LLVM fast tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run fast tests
        run: uv run pytest tests/ -q -m "not slow" -n auto

  linux-x86-llvm-slow:
    name: Linux x86_64 LLVM slow tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run slow tests
        run: uv run pytest tests/ -q -m slow -n auto

  macos-arm64-backends:
    name: macOS ARM64 LLVM and self backend tests
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Show runner architecture
        run: uname -a && python -c "import platform; print(platform.system(), platform.machine())"

      - name: Run LLVM backend tests on ARM64
        run: uv run pytest tests/test_llvm.py -q

      - name: Run self ARM64 backend tests
        run: uv run pytest tests/test_arm64.py -q

  nekoscope-cross-platform:
    name: NekoScope compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nekoscope/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install NekoScope dependencies
        working-directory: nekoscope
        run: npm ci

      - name: Show Node runtime
        working-directory: nekoscope
        run: node -e "console.log(process.platform, process.arch)"

      - name: Validate NekoScope dev script
        working-directory: nekoscope
        run: node ./scripts/dev.mjs --help

      - name: Run NekoScope tests
        working-directory: nekoscope
        run: npm test

      - name: Build NekoScope
        working-directory: nekoscope
        run: npm run build

      - name: Package NekoScope directory
        working-directory: nekoscope
        run: npm run pack

      - name: Verify bundled uv in packaged app
        working-directory: nekoscope
        shell: bash
        run: |
          case "${RUNNER_OS}" in
            Linux)
              test -x release/linux-unpacked/resources/bin/uv
              ;;
            macOS)
              test -x release/mac-arm64/NekoScope.app/Contents/Resources/bin/uv
              ;;
            Windows)
              test -f release/win-unpacked/resources/bin/uv.exe
              ;;
          esac
