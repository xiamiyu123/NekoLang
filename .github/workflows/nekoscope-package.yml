name: NekoScope Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version. Defaults to current UTC timestamp: yyyyMMddHHmm."
        required: false
        type: string
  push:
    tags:
      - "nekoscope-v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.14"

jobs:
  prepare-release:
    name: Prepare NekoScope release
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.version.outputs.release_name }}
      release_version: ${{ steps.version.outputs.release_version }}

    steps:
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/nekoscope-v* ]]; then
            version="${GITHUB_REF_NAME#nekoscope-v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          else
            version="$(date -u +'%Y%m%d%H%M')"
          fi

          echo "release_version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_name=nekoscope-v${version}" >> "${GITHUB_OUTPUT}"
          echo "NekoScope release version: ${version}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/nekoscope-v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.version.outputs.release_name }}" \
              --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${{ steps.version.outputs.release_name }}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${{ github.sha }}" \
              --title "${{ steps.version.outputs.release_name }}" \
              --notes "NekoScope release ${{ steps.version.outputs.release_name }}"

  package:
    name: NekoScope package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: prepare-release

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            artifact: nekoscope-linux-x64
            release_glob: |
              nekoscope/release/*.AppImage
              nekoscope/release/*.deb
          - name: macos-arm64
            os: macos-14
            artifact: nekoscope-macos-arm64
            release_glob: |
              nekoscope/release/*.dmg
              nekoscope/release/*.zip
          - name: windows-x64
            os: windows-latest
            artifact: nekoscope-windows-x64
            release_glob: |
              nekoscope/release/*.exe
              nekoscope/release/*.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nekoscope/package-lock.json

      - name: Install NekoScope dependencies
        working-directory: nekoscope
        run: npm ci

      - name: Run NekoScope tests
        working-directory: nekoscope
        run: npm test

      - name: Build Electron packages
        working-directory: nekoscope
        env:
          NEKOSCOPE_RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
        run: npm run dist

      - name: Upload packaged app artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.release_glob }}
          if-no-files-found: error

      - name: Upload packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_name }}
          files: ${{ matrix.release_glob }}
